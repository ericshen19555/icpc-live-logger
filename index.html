<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>ICPC Live Logger</title>
  <style>
    :root { color-scheme: dark; --bg:#10131a; --panel:#191e29; --panel2:#222a38; --line:#394254; --text:#f0f3fa; --muted:#aab4c5; --accent:#75b8ff; --good:#66d6a5; --danger:#ff8893; --warn:#f4c86b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    main { width:min(980px,100%); margin:auto; padding:18px 14px 48px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; }
    h1 { margin:0 0 4px; font-size:1.5rem; } h2 { margin:0 0 10px; font-size:1.05rem; }
    .subtitle,.hint,#status { color:var(--muted); font-size:.9rem; } .status { min-height:1.3em; margin:8px 0; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px; }
    .row { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
    button,select,input,textarea { font:inherit; }
    button { cursor:pointer; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 11px; min-height:40px; }
    button:hover,button:focus-visible { border-color:var(--accent); outline:none; } button.primary { background:#245d99; border-color:#4f9ae5; } button.danger { color:#ffdbe0; border-color:#9d4a58; } button.selected { background:#275a8d; border-color:var(--accent); }
    .btn-icon { width:40px; height:40px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
    .btn-icon svg { width:20px; height:20px; fill:currentColor; color:var(--muted); transition:color .15s ease; }
    .btn-icon:hover svg,.btn-icon:focus-visible svg { color:var(--text); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:7px; }
    .grid button { padding:7px 4px; } .type-grid { grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); }
    label { display:grid; gap:5px; color:var(--muted); font-size:.86rem; } input,select,textarea { color:var(--text); background:#111620; border:1px solid var(--line); border-radius:7px; padding:8px; min-height:38px; } textarea { min-height:76px; resize:vertical; }
    .two { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .hidden { display:none!important; }
    .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; min-width:580px; } th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); } th button { padding:3px 5px; min-height:auto; border:0; background:none; color:var(--accent); } tr.event-row { cursor:pointer; } tr.event-row:hover { background:#202837; } tr.deleted { color:var(--muted); text-decoration:line-through; }
    .event-kind { color:var(--accent); } .empty { text-align:center; color:var(--muted); padding:20px; }
    .modal-backdrop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; background:#000a; z-index:10; } .modal { width:min(600px,100%); max-height:92vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; } .modal h2 { margin-bottom:14px; }
    .modal .actions { justify-content:flex-end; margin-top:14px; } .modal .danger { margin-right:auto; }

    /* 破台按鈕 (all_ac) 漸變流光樣式 */
    button[data-general="all_ac"], button[data-edit-type="all_ac"] {
      position: relative;
      z-index: 1;
      border: 1px solid transparent !important;
      overflow: hidden;
      transition: border-color 0.4s ease, transform 0.2s ease;
    }
    button[data-general="all_ac"]::before, button[data-edit-type="all_ac"]::before {
      content: "";
      position: absolute;
      inset: -3px;
      z-index: -2;
      border-radius: 12px;
      background: radial-gradient(circle at 10% 20%, #ff2a6d, transparent 50%),
                  radial-gradient(circle at 90% 80%, #05dda6, transparent 50%),
                  radial-gradient(circle at 80% 10%, #ffc700, transparent 50%),
                  radial-gradient(circle at 20% 90%, #9d4edd, transparent 50%);
      background-size: 200% 200%;
      opacity: 0.35;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0));
      transition: opacity 0.4s ease, filter 0.4s ease;
      animation: organicFluid 6s ease-in-out infinite alternate;
    }
    button[data-general="all_ac"]::after, button[data-edit-type="all_ac"]::after {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      background: var(--panel2);
      border-radius: 8px;
      transition: background 0.4s ease;
    }
    button[data-general="all_ac"]:hover::before, button[data-edit-type="all_ac"]:hover::before {
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(102, 214, 165, 0.85));
    }
    @keyframes organicFluid {
      0%   { background-position: 0% 0%; filter: hue-rotate(0deg); }
      33%  { background-position: 100% 40%; filter: hue-rotate(110deg); }
      66%  { background-position: 20% 100%; filter: hue-rotate(220deg); }
      100% { background-position: 100% 100%; filter: hue-rotate(360deg); }
    }

    @media (max-width:560px) { main { padding:12px 9px 30px; } section { padding:12px; } .two { grid-template-columns:1fr; } .type-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>ICPC Live Logger</h1>
      <div class="subtitle">離線、即時儲存、個人團練事件紀錄</div>
    </div>
    <button id="downloadSelfButton" type="button" class="btn-icon" title="下載 HTML 原始檔" aria-label="下載 HTML 原始檔">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </button>
  </header>
  <div id="status" class="status" aria-live="polite"></div>

  <section>
    <h2>1. 選擇題目</h2>
    <div id="problemGrid" class="grid" aria-label="題目"></div>
  </section>

  <section>
    <h2>2. 記錄事件</h2>
    <div id="typeGrid" class="grid type-grid"></div>
    <div class="row" style="margin-top:10px"><span class="hint">通用：</span><div id="generalGrid" class="row"></div></div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between"><h2>事件預覽</h2><span id="eventCount" class="hint"></span></div>
    <div class="table-wrap"><table><thead><tr><th><button id="timeMode" title="切換全表時間顯示">時間：絕對</button></th><th>題號・事件類型</th><th>備註</th></tr></thead><tbody id="eventList"></tbody></table></div>
  </section>

  <section>
    <h2>匯出與資料管理</h2>
    <div class="two">
      <label>開始事件<select id="exportStart"></select></label>
      <label>結束事件<select id="exportEnd"></select></label>
    </div>
    <div class="row" style="margin-top:12px"><button id="exportButton" class="primary">匯出 JSON Data</button><button id="clearButton" class="danger">清空所有本機紀錄</button></div>
    <div class="hint" style="margin-top:8px">匯出包含已刪除事件。匯出不會清除本機資料。</div>
  </section>
</main>

<div id="editorBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <form id="editor" class="modal">
    <h2 id="editorTitle">編輯事件</h2>
    <div class="two">
      <label>時間<input id="editTime" type="datetime-local" step="1" required></label>
      <label>題號<select id="editProblem"></select></label>
    </div>
    <label style="margin-top:10px">事件類型</label>
    <div id="editTypeGrid" class="grid type-grid" style="margin-top:5px"></div>
    <div class="row" style="margin-top:10px"><span class="hint">通用：</span><div id="editGeneralGrid" class="row"></div></div>
    <label style="margin-top:10px">備註<textarea id="editNote" placeholder="可留空"></textarea></label>
    <div class="row actions" style="margin-top:14px"><button id="deleteButton" class="danger" type="button">標記為刪除</button><button id="cancelEdit" type="button">取消</button><button class="primary" type="submit">儲存修改</button></div>
  </form>
</div>

<div id="exportModalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
  <div class="modal">
    <h2 id="exportModalTitle">匯出結果摘要</h2>
    <div id="exportModalContent" style="display:grid; gap:12px; margin-top:10px;"></div>
    <div class="row actions" style="margin-top:18px;">
      <button id="closeExportModal" class="primary" type="button">確定</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const KEY = 'icpc-live-logger-v1';
  const PROBLEMS = ['General', ...Array.from({length:26}, (_, i) => `p${String.fromCharCode(65+i)}`)];
  const TYPES = {
    read_think: {label:'讀題 + 想解'},
    solved_discuss: {label:'想出並討論解法'},
    coding: {label:'實作'},
    debug: {label:'除錯'},
    custom_problem: {label:'自訂'},
    
    contest_start: {label:'開始比賽', general:true},
    contest_end: {label:'結束比賽', general:true},
    away: {label:'中離', general:true},
    back: {label:'回來', general:true},
    all_ac: {label:'破台', general:true},
    custom_general: {label:'自訂', general:true}
  };
  let state = load();
  let selectedProblem = 'General';
  let relativeMode = false;
  let editingId = null;
  let editingType = null;
  let backdropMouseDownOnSelf = false;

  const $ = id => document.getElementById(id);
  const status = message => { $('status').textContent = message; };

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved && Array.isArray(saved.events)) return {version:1, events:saved.events};
    } catch (_) { /* start fresh */ }
    return {version:1, events:[]};
  }
  function persist() {
    const trySave = () => localStorage.setItem(KEY, JSON.stringify(state));
    try { trySave(); return; }
    catch (_) {
      state.events.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
      while (state.events.length) {
        state.events.shift();
        try { trySave(); status('空間不足，已移除最舊事件後儲存。'); return; } catch (_) { /* keep trimming */ }
      }
      status('無法寫入本機儲存空間。');
    }
  }
  function nowISO() { return new Date().toISOString(); }
  function uid() { return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
  function labelFor(type) { return TYPES[type]?.label || type; }
  function makeEvent({problem, type, note=''}) {
    state.events.push({id:uid(), timestamp:nowISO(), problem:problem || 'General', type, note, deleted:false});
    persist(); render();
  }
  function sortedEvents() { return [...state.events].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)); }
  function localInputValue(iso) {
    const d = new Date(iso); const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function absoluteTime(iso) { return new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso)); }
  function relativeTime(event) {
    const activeStarts = state.events.filter(e => !e.deleted && e.type === 'contest_start').sort((a,b) => new Date(a.timestamp)-new Date(b.timestamp));
    if (!activeStarts.length) return absoluteTime(event.timestamp);
    const time = new Date(event.timestamp).getTime();
    const prior = activeStarts.filter(e => new Date(e.timestamp).getTime() <= time).pop();
    const anchor = prior || activeStarts.find(e => new Date(e.timestamp).getTime() > time);
    const sec = Math.round((time - new Date(anchor.timestamp).getTime()) / 1000);
    const sign = sec < 0 ? '-' : '+'; const n = Math.abs(sec);
    return `${sign}${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n%3600/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
  }

  function formatDuration(ms) {
    if (!ms || ms <= 0) return '0 秒';
    const totalSec = Math.floor(ms / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    const parts = [];
    if (days > 0) parts.push(`${days} 天`);
    if (hours > 0) parts.push(`${hours} 小時`);
    if (mins > 0) parts.push(`${mins} 分鐘`);
    if (secs > 0 || parts.length === 0) parts.push(`${secs} 秒`);
    return parts.join(' ');
  }

  function renderProblemGrid() {
    $('problemGrid').innerHTML = PROBLEMS.map(p => {
      const isGen = p === 'General';
      const label = isGen ? '*' : p;
      return `<button type="button" data-problem="${p}" class="${selectedProblem===p?'selected':''}" ${isGen ? 'title="通用"' : ''}>${label}</button>`;
    }).join('');
  }
  function renderTypes() {
    const typeKeys = Object.keys(TYPES).filter(k => !TYPES[k].general);
    $('typeGrid').innerHTML = typeKeys.map(k => `<button type="button" data-type="${k}" ${selectedProblem?'':'disabled'}>${TYPES[k].label}</button>`).join('');
    $('generalGrid').innerHTML = Object.keys(TYPES).filter(k => TYPES[k].general).map(k => `<button type="button" data-general="${k}">${TYPES[k].label}</button>`).join('');
  }
  function renderEvents() {
    const events = sortedEvents();
    $('eventCount').textContent = `${events.length} 筆`;
    $('timeMode').textContent = `時間：${relativeMode ? '相對' : '絕對'}`;
    $('eventList').innerHTML = events.length ? events.map(e => `<tr class="event-row ${e.deleted?'deleted':''}" data-id="${e.id}"><td>${relativeMode ? relativeTime(e) : absoluteTime(e.timestamp)}</td><td>${e.problem ? `${e.problem} ・ ` : ''}<span class="event-kind">${labelFor(e.type)}</span></td><td>${escapeHtml(e.note || '—')}</td></tr>`).join('') : '<tr><td class="empty" colspan="3">尚無紀錄</td></tr>';
  }
  function renderEditTypes() {
    const typeKeys = Object.keys(TYPES).filter(k => !TYPES[k].general);
    $('editTypeGrid').innerHTML = typeKeys.map(k => `<button type="button" data-edit-type="${k}" class="${editingType===k?'selected':''}">${TYPES[k].label}</button>`).join('');
    $('editGeneralGrid').innerHTML = Object.keys(TYPES).filter(k => TYPES[k].general).map(k => `<button type="button" data-edit-type="${k}" class="${editingType===k?'selected':''}">${TYPES[k].label}</button>`).join('');
  }
  function escapeHtml(value) { const d=document.createElement('div'); d.textContent=value; return d.innerHTML; }
  function eventOption(e) { return `${absoluteTime(e.timestamp)} · ${labelFor(e.type)}${e.note ? ` · ${e.note}` : ''}`; }
  function renderExportSelects() {
    const starts = state.events.filter(e => !e.deleted && e.type==='contest_start').sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
    const ends = state.events.filter(e => !e.deleted && e.type==='contest_end').sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
    const previousStart=$('exportStart').value, previousEnd=$('exportEnd').value;

    const makeOptions = items => '<option value="__all__">匯出所有事件（預設）</option><option value="__today__">當日所有事件</option>' + items.map(e=>`<option value="${e.id}">${escapeHtml(eventOption(e))}</option>`).join('');

    $('exportStart').innerHTML = makeOptions(starts);
    $('exportEnd').innerHTML = makeOptions(ends);

    const startValid = Array.from($('exportStart').options).some(o => o.value === previousStart);
    const endValid = Array.from($('exportEnd').options).some(o => o.value === previousEnd);

    $('exportStart').value = startValid ? previousStart : '__all__';
    $('exportEnd').value = endValid ? previousEnd : '__all__';
  }
  function render() { renderProblemGrid(); renderTypes(); renderEvents(); renderExportSelects(); }

  function openEditor(id) {
    const e=state.events.find(x=>x.id===id); if (!e) return; editingId=id; editingType=e.type;
    $('editTime').value=localInputValue(e.timestamp);
    $('editProblem').innerHTML=PROBLEMS.map(p=>`<option value="${p}">${p}</option>`).join('');
    $('editProblem').value=e.problem||'General';
    $('editNote').value=e.note||'';
    $('deleteButton').textContent=e.deleted ? '取消刪除標記' : '標記為刪除';
    renderEditTypes();
    $('editorBackdrop').classList.remove('hidden');
  }
  function closeEditor() { $('editorBackdrop').classList.add('hidden'); editingId=null; editingType=null; }
  function todayBounds() { const d=new Date(), start=new Date(d.getFullYear(),d.getMonth(),d.getDate()), end=new Date(start); end.setDate(end.getDate()+1); return [start,end]; }

  function showExportSummaryModal({ count, durationMs, autoMatchNote, from, to }) {
    const isCountZero = count === 0;
    const isDurationZero = durationMs === 0;

    const countHtml = isCountZero
      ? `<span style="color:var(--danger); font-weight:bold;">0 筆</span>`
      : `<span style="color:var(--good); font-weight:bold;">${count} 筆</span>`;

    const durationHtml = isDurationZero
      ? `<span style="color:var(--danger); font-weight:bold;">0 秒</span>`
      : `<span>${formatDuration(durationMs)}</span>`;

    let warningBanner = '';
    if (isCountZero || isDurationZero) {
      const warnText = (isCountZero && isDurationZero)
        ? '匯出筆數與涵蓋時間長度皆為 0！'
        : (isCountZero ? '匯出資料筆數為 0 筆！' : '涵蓋時間長度為 0 秒！');
      warningBanner = `<div style="padding:10px; background:rgba(255,136,147,0.15); border:1px solid var(--danger); border-radius:8px; color:var(--danger); font-size:0.9rem;">⚠️ 注意：${warnText}</div>`;
    }

    let noteBanner = '';
    if (autoMatchNote) {
      noteBanner = `<div style="padding:10px; background:var(--panel2); border:1px solid var(--accent); border-radius:8px; color:var(--accent); font-size:0.88rem;">ℹ️ 邊界自動匹配提示：${escapeHtml(autoMatchNote)}</div>`;
    }

    let rangeText = '';
    if (from && to && count > 0) {
      rangeText = `<div class="hint">時間範圍：${absoluteTime(from.toISOString())} ～ ${absoluteTime(to.toISOString())}</div>`;
    }

    $('exportModalContent').innerHTML = `
      ${warningBanner}
      ${noteBanner}
      <div style="font-size:1.05rem;"><strong>總共匯出筆數：</strong>${countHtml}</div>
      <div style="font-size:1.05rem;"><strong>涵蓋時間長度：</strong>${durationHtml}</div>
      ${rangeText}
    `;

    $('exportModalBackdrop').classList.remove('hidden');
  }

  function exportData() {
    const get = id => state.events.find(e => e.id === id);
    const startVal = $('exportStart').value;
    const endVal = $('exportEnd').value;

    const sortedAsc = [...state.events].sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
    const firstEvt = sortedAsc[0];
    const lastEvt = sortedAsc[sortedAsc.length - 1];

    let from = null;
    let to = null;
    let autoMatchNote = '';

    const startEvt = (startVal !== '__all__' && startVal !== '__today__') ? get(startVal) : null;
    const endEvt = (endVal !== '__all__' && endVal !== '__today__') ? get(endVal) : null;

    if (startEvt && endEvt) {
      const tStart = new Date(startEvt.timestamp);
      const tEnd = new Date(endEvt.timestamp);
      if (tEnd >= tStart) {
        from = tStart;
        to = tEnd;
      } else {
        from = tStart;
        to = lastEvt ? new Date(lastEvt.timestamp) : tStart;
        autoMatchNote = '選擇的結束比賽時間早於開始比賽，已自動將結束邊界匹配至最後一個紀錄事件。';
      }
    } else if (startEvt && !endEvt) {
      from = new Date(startEvt.timestamp);
      if (endVal === '__today__') {
        const [, tEndToday] = todayBounds();
        to = tEndToday;
      } else {
        to = lastEvt ? new Date(lastEvt.timestamp) : from;
        autoMatchNote = `已選擇開始比賽，但未匹配到對應結束比賽，已自動匹配結束點至最後一個事件 (${lastEvt ? absoluteTime(lastEvt.timestamp) : '無'})。`;
      }
    } else if (!startEvt && endEvt) {
      to = new Date(endEvt.timestamp);
      if (startVal === '__today__') {
        const [tStartToday] = todayBounds();
        from = tStartToday;
      } else {
        from = firstEvt ? new Date(firstEvt.timestamp) : to;
        autoMatchNote = `已選擇結束比賽，但未匹配到對應開始比賽，已自動匹配起始點至第一個事件 (${firstEvt ? absoluteTime(firstEvt.timestamp) : '無'})。`;
      }
    } else {
      if (startVal === '__today__' && endVal === '__today__') {
        [from, to] = todayBounds();
      } else if (startVal === '__today__') {
        const [tStartToday] = todayBounds();
        from = tStartToday;
        to = lastEvt ? new Date(lastEvt.timestamp) : tStartToday;
      } else if (endVal === '__today__') {
        const [, tEndToday] = todayBounds();
        to = tEndToday;
        from = firstEvt ? new Date(firstEvt.timestamp) : tEndToday;
      } else {
        from = firstEvt ? new Date(firstEvt.timestamp) : null;
        to = lastEvt ? new Date(lastEvt.timestamp) : null;
      }
    }

    let events = [];
    if (from && to) {
      events = state.events.filter(e => {
        const t = new Date(e.timestamp);
        return t >= from && t <= to;
      }).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
    }

    const durationMs = (from && to && events.length > 0) ? Math.max(0, to.getTime() - from.getTime()) : 0;

    const payload = {
      version: 1,
      exportedAt: nowISO(),
      range: {
        from: from ? from.toISOString() : null,
        to: to ? to.toISOString() : null
      },
      events
    };
    const stamp = localInputValue(nowISO()).replace('T','_').replace(/:/g,'').slice(0,13);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}));
    link.download = `icpc-live-log-${stamp}.json`;
    link.click();
    URL.revokeObjectURL(link.href);

    showExportSummaryModal({ count: events.length, durationMs, autoMatchNote, from, to });
    status(`已匯出 ${events.length} 筆事件。`);
  }

  function downloadSelf() {
    const content = '<!doctype html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'index.html';
    link.click();
    URL.revokeObjectURL(link.href);
    status('已下載 index.html。');
  }

  // 彩炮與動力學氣球動畫引擎
  function triggerCelebration() {
    const CONFETTI_WAVES = 8;
    const CONFETTI_INTERVAL_MS = 200;
    const CONFETTI_PARTICLES_PER_WAVE = 1500;

    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    const colors = ['#ff3366', '#ff9900', '#ffff33', '#33cc33', '#3399ff', '#9933ff', '#ff66cc'];

    function randomGaussian(mean = 0, stdev = 1) {
      const u1 = 1 - Math.random();
      const u2 = 1 - Math.random();
      const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      return z0 * stdev + mean;
    }

    const baseScale = Math.min(w, h);
    const gravity = h * 0.00035;
    let windTime = 0;

    const confettis = [];

    function spawnConfettiWave(count = CONFETTI_PARTICLES_PER_WAVE) {
      for (let i = 0; i < count; i++) {
        const fromLeft = Math.random() < 0.5;

        const originX = fromLeft ? w * 0.02 : w * 0.98;
        const originY = h * 0.98;
        const r = Math.random() * (baseScale * 0.015);
        const phi = Math.random() * Math.PI * 2;

        const baseAngleDeg = (fromLeft ? 1 : -1) * randomGaussian(27, 15);
        const angleRad = (baseAngleDeg * Math.PI) / 180;
        const speed = h * randomGaussian(0.032, 0.0045);

        confettis.push({
          x: originX + r * Math.cos(phi),
          y: originY + r * Math.sin(phi),
          vx: Math.sin(angleRad) * speed * (w / h),
          vy: -Math.cos(angleRad) * speed,
          size: (Math.random() * 0.006 + 0.008) * baseScale,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          rSpeed: (Math.random() - 0.5) * 0.28,
          drag: 0.98,
          windSensitivity: randomGaussian(1, 0.8)
        });
      }
    }

    let wavesFired = 0;
    spawnConfettiWave(CONFETTI_PARTICLES_PER_WAVE);
    wavesFired++;

    const waveTimer = setInterval(() => {
      if (wavesFired < CONFETTI_WAVES) {
        spawnConfettiWave(CONFETTI_PARTICLES_PER_WAVE);
        wavesFired++;
      } else {
        clearInterval(waveTimer);
      }
    }, CONFETTI_INTERVAL_MS);

    const balloons = Array.from({length: 40}, () => {
      const rX = (Math.random() * 0.012 + 0.018) * baseScale;
      const rY = (Math.random() * 0.015 + 0.022) * baseScale;
      return {
        x0: Math.random() * (w - rX * 4) + rX * 2,
        y: h + Math.random() * h * 0.35 + rX * 2,
        rX,
        rY,
        speedY: (Math.random() * 0.002 + 0.003) * h,
        amp: (Math.random() * 0.015 + 0.01) * w,
        freq: Math.random() * 1.2 + 1.2,
        phase: Math.random() * Math.PI * 2,
        color: colors[Math.floor(Math.random() * colors.length)], 
        windSensitivity: randomGaussian(1, 0.8) * 0.2
      };
    });

    let startTime = performance.now();
    let animId;

    function draw(now) {
      const t = (now - startTime) / 1000;
      windTime += 0.0008;
      ctx.clearRect(0, 0, w, h);

      const globalWindX = Math.sin(windTime * 2 * Math.PI) * randomGaussian(0, 0.0001) * baseScale;
      const globalWindY = Math.cos(windTime * Math.PI) * randomGaussian(0, 0.00001) * h;

      for (let i = confettis.length - 1; i >= 0; i--) {
        const p = confettis[i];
        p.vx += globalWindX * p.windSensitivity;
        p.vy += globalWindY * p.windSensitivity;

        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rSpeed;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();

        if (p.y > h + 100) {
          confettis.splice(i, 1);
        }
      }

      let activeBalloons = 0;
      for (const b of balloons) {
        b.y -= b.speedY;

        const dx = b.amp * Math.sin(b.freq * t + b.phase);
        const vx = b.amp * b.freq * Math.cos(b.freq * t + b.phase);

        b.x0 += globalWindX * b.windSensitivity;
        const currentX = b.x0 + dx;

        if (b.y > -b.rY - 60) {
          activeBalloons++;

          ctx.save();
          ctx.translate(currentX, b.y);

          const bend1 = -vx * 0.12;
          const bend2 = -vx * 0.22;

          ctx.beginPath();
          ctx.moveTo(0, b.rY);
          ctx.bezierCurveTo(
            bend1, b.rY + 15,
            bend2, b.rY + 30,
            bend2 * 1.2, b.rY + 45
          );
          ctx.strokeStyle = 'rgba(240,243,250,0.45)';
          ctx.lineWidth = Math.max(1, baseScale * 0.0015);
          ctx.stroke();

          ctx.beginPath();
          ctx.ellipse(0, 0, b.rX, b.rY, 0, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(-b.rX * 0.15, b.rY);
          ctx.lineTo(b.rX * 0.15, b.rY);
          ctx.lineTo(0, b.rY + b.rY * 0.15);
          ctx.closePath();
          ctx.fillStyle = b.color;
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(-b.rX * 0.35, -b.rY * 0.35, b.rX * 0.25, b.rY * 0.15, -Math.PI / 4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.38)';
          ctx.fill();

          ctx.restore();
        }
      }

      if (activeBalloons > 0 || confettis.length > 0 || wavesFired < CONFETTI_WAVES || t < 5.0) {
        animId = requestAnimationFrame(draw);
      } else {
        clearInterval(waveTimer);
        cancelAnimationFrame(animId);
        canvas.remove();
      }
    }

    animId = requestAnimationFrame(draw);
  }

  $('problemGrid').addEventListener('click', e=>{const p=e.target.dataset.problem; if(p){selectedProblem=p; render();}});
  $('typeGrid').addEventListener('click', e=>{
    const type=e.target.dataset.type;
    if(type && selectedProblem) {
      makeEvent({problem:selectedProblem, type});
      status(`已記錄：${selectedProblem} - ${TYPES[type].label}`);
    }
  });
  $('generalGrid').addEventListener('click', e=>{
    const type=e.target.dataset.general; 
    if(type) {
      selectedProblem = 'General';
      renderProblemGrid();
      makeEvent({problem:'General', type});
      if (type === 'all_ac') {
        status('恭喜破台 Orz🎈');
        triggerCelebration();
      } else {
        status(`已記錄通用事件：${TYPES[type].label}`);
      }
    }
  });
  $('timeMode').addEventListener('click',()=>{relativeMode=!relativeMode;renderEvents();});
  $('eventList').addEventListener('click',e=>{const row=e.target.closest('[data-id]'); if(row) openEditor(row.dataset.id);});
  
  const handleEditTypeClick = e => {
    const type=e.target.dataset.editType;
    if(type) { editingType=type; renderEditTypes(); }
  };
  $('editTypeGrid').addEventListener('click', handleEditTypeClick);
  $('editGeneralGrid').addEventListener('click', handleEditTypeClick);

  $('cancelEdit').addEventListener('click',closeEditor);

  $('editorBackdrop').addEventListener('mousedown', e => {
    backdropMouseDownOnSelf = (e.target === $('editorBackdrop'));
  });
  $('editorBackdrop').addEventListener('mouseup', e => {
    if (backdropMouseDownOnSelf && e.target === $('editorBackdrop')) {
      closeEditor();
    }
    backdropMouseDownOnSelf = false;
  });

  $('closeExportModal').addEventListener('click', () => $('exportModalBackdrop').classList.add('hidden'));
  $('exportModalBackdrop').addEventListener('click', e => {
    if (e.target === $('exportModalBackdrop'))$('exportModalBackdrop').classList.add('hidden');
  });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('editorBackdrop').classList.contains('hidden')) closeEditor();
      if (!$('exportModalBackdrop').classList.contains('hidden'))$('exportModalBackdrop').classList.add('hidden');
    }
  });

  $('editor').addEventListener('keydown', e => {
    if (e.isComposing) return;
    const isMac = navigator.userAgent.includes('Mac');
    const hasModifier = isMac ? e.metaKey : e.ctrlKey;
    if (hasModifier && e.key === 'Enter') {
      e.preventDefault();
      $('editor').requestSubmit();
    }
  });

  $('deleteButton').addEventListener('click',()=>{const e=state.events.find(x=>x.id===editingId); if(e){e.deleted=!e.deleted;persist();render();closeEditor();status(e.deleted?'已標記為刪除。':'已取消刪除標記。');}});
  $('editor').addEventListener('submit',e=>{
    e.preventDefault();
    const event=state.events.find(x=>x.id===editingId); if(!event)return;
    const local=$('editTime').value; if(!local)return;
    event.timestamp=new Date(local).toISOString();
    event.problem=$('editProblem').value||'General';
    event.type=editingType || event.type;
    event.note=$('editNote').value.trim();
    persist();render();closeEditor();status('已儲存修改。');
  });
  $('exportButton').addEventListener('click',exportData);
  $('downloadSelfButton').addEventListener('click',downloadSelf);
  $('clearButton').addEventListener('click',()=>{if(confirm('確定要清空此裝置的所有事件嗎？')) if(confirm('此動作無法復原，仍要清空嗎？')) {state.events=[];persist();render();status('已清空所有本機紀錄。');}});
  window.onbeforeunload=()=>undefined;
  render(); status(state.events.length ? '已從本機還原紀錄。' : '準備開始記錄。');
})();
</script>
